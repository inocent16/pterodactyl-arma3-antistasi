// Arma 3 dedicated server configuration for the Pterodactyl Antistasi Ultimate egg.
// Mission rotation is intentionally not hard-coded here. Admins select missions
// in-game with #missions; available missions are discovered by the Arma server.

// === GLOBAL SETTINGS ===
hostname = "Arma 3 - Antistasi Ultimate";
password = "";
// passwordAdmin = "CHANGE_ME";
logFile = "server_console.log";
timeStampFormat = "short";
motd[] = { "Welcome to the server" };
motdInterval = 5;

// Keep mission changes in-process. A non-zero value can restart/shutdown the
// dedicated server after missionEnd (including #missions selection).
missionsToServerRestart = 0;
missionsToShutdown = 0;

// Do not define missionWhitelist[] unless you intentionally want to restrict
// the #missions list. Do not add a static class Missions rotation here.

// === JOINING RULES ===
maxPlayers = 32;
BattlEye = 1;
verifySignatures = 2;
kickDuplicate = 1;
allowedFilePatching = 0;
loopback = 0;
upnp = 0;
headlessClients[] = { "127.0.0.1" };
localClient[] = { "127.0.0.1" };

// === IN-GAME SETTINGS ===
forceRotorLibSimulation = 0;
disableVoN = 0;
vonCodec = 1;
vonCodecQuality = 10;
persistent = 0;
drawingInMap = 1;
forcedDifficulty = "regular";

// === VOTING ===
voteMissionPlayers = 1;
voteThreshold = 0.33;

// === NETWORK HEALTH ===
disconnectTimeout = 90;
maxdesync = 150;
maxping = 200;
maxpacketloss = 50;
kickClientsOnSlowNetwork[] = { 1, 1, 0, 1 };
kickTimeout[] = { {0, -1},{1, 1},{2, 5},{3, 1} };

// === SERVER-SIDE SCRIPTING ===
onUserConnected = "";
onUserDisconnected = "";
doubleIdDetected = "";
onUnsignedData = "kick (_this select 0)";
onHackedData = "kick (_this select 0)";
onDifferentData = "";
allowedLoadFileExtensions[] = {"hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi"};
allowedPreprocessFileExtensions[] = {"hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi"};
allowedHTMLLoadExtensions[] = {"htm","html","xml","txt"};
